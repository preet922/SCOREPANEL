<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>MalwaLive Scoreboard - Overlay for vMix</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Inter:wght@800;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:transparent;overflow:hidden}
  body{font-family:Inter,system-ui,sans-serif}
  .overlay-root{width:1920px;height:400px;display:flex;align-items:center;justify-content:center;background:transparent;position:relative}
  .scoreboard-wrap{display:flex;align-items:stretch;justify-content:center;filter:drop-shadow(0 10px 30px rgba(0,0,0,.6))}
  .score-box{width:142px;height:142px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;isolation:isolate}
  .score-box.blue{background:linear-gradient(180deg,#0a3bd8 0%,#0627a0 100%);border-radius:18px 0 0 18px;border:1px solid rgba(255,255,255,.15);border-right:none}
  .score-box.red{background:linear-gradient(180deg,#d00000 0%,#900000 100%);border-radius:0 18px 18px 0;border:1px solid rgba(255,255,255,.15);border-left:none}
  .gloss-highlight{position:absolute;top:0;left:0;right:0;height:42%;background:linear-gradient(180deg,rgba(255,255,255,.28) 0%, rgba(255,255,255,0) 100%);z-index:1;pointer-events:none}
  .score-inner{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;width:100%;height:100%}
  .score-num{font-family:'Oswald',sans-serif;font-size:84px;font-weight:700;line-height:1;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.5);letter-spacing:-1px}
  .score-box.pulse{animation:boxPulse .6s ease}
  @keyframes boxPulse{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
  .ticker-bar{position:absolute;bottom:0;left:0;right:0;height:26px;background:rgba(0,0,0,.85);overflow:hidden;display:flex;align-items:center;border-top:1px solid rgba(255,255,255,.12);z-index:3}
  .ticker-track{white-space:nowrap;font-size:11px;font-weight:800;letter-spacing:1px;color:#fff;display:inline-block;padding-left:100%;animation:scroll 18s linear infinite}
  .ticker-track.right-scroll{animation:scrollRight 18s linear infinite}
  @keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
  @keyframes scrollRight{0%{transform:translateX(-100%)}100%{transform:translateX(0)}}
  .center-box{width:460px;height:142px;background:linear-gradient(180deg,#2d2d2d 0%,#171717 100%);border:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;gap:2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
  .center-box::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent)}
  .team{font-family:'Oswald',sans-serif;font-size:34px;font-weight:700;line-height:.95;color:#fff;text-transform:uppercase;letter-spacing:.8px;text-shadow:0 1px 0 rgba(0,0,0,.8),0 2px 8px rgba(0,0,0,.6);white-space:nowrap;max-width:340px;overflow:hidden;text-overflow:ellipsis;z-index:2}
  .vs{font-family:'Inter',sans-serif;font-size:18px;font-weight:900;color:#7a7a7a;letter-spacing:3px;line-height:1;z-index:2;text-shadow:0 1px 0 rgba(0,0,0,.8);margin:2px 0}
  .live-pill{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,#ff2a2a 0%,#d00000 100%);border:1.5px solid rgba(255,255,255,.65);border-radius:999px;padding:3px 14px 3px 10px;display:flex;align-items:center;gap:7px;font-size:11px;font-weight:900;letter-spacing:1.2px;color:#fff;line-height:1;box-shadow:0 0 0 3px rgba(255,0,0,.18),0 0 18px rgba(255,0,0,.65),0 3px 10px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.5);z-index:10;animation:liveGlow 1.6s ease-in-out infinite;white-space:nowrap}
  .live-dot{width:8px;height:8px;background:#fff;border-radius:50%;box-shadow:0 0 6px #fff;animation:liveBlink .9s steps(2,end) infinite;flex-shrink:0}
  @keyframes liveBlink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.25;transform:scale(.8)}}
  @keyframes liveGlow{0%,100%{box-shadow:0 0 0 3px rgba(255,0,0,.18),0 0 18px rgba(255,0,0,.65),0 3px 10px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.5)}50%{box-shadow:0 0 0 5px rgba(255,0,0,.28),0 0 28px rgba(255,0,0,.9),0 3px 10px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.5)}}
  .tournament-strip{position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);min-width:320px;height:24px;background:linear-gradient(180deg,#2a2a2a 0%,#1c1c1c 100%);border:1px solid rgba(255,255,255,.12);border-radius:6px;display:flex;align-items:center;justify-content:center;padding:0 18px;font-size:11px;font-weight:800;letter-spacing:1.4px;color:#d6d6d6;text-transform:uppercase;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08);z-index:5}
  .float-badge{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:42px;font-weight:900;color:#ffe600;text-shadow:0 2px 10px rgba(0,0,0,.8);animation:floatUp 1s ease-out forwards;pointer-events:none;z-index:10}
  @keyframes floatUp{0%{transform:translate(-50%,-20%);opacity:0}20%{opacity:1}100%{transform:translate(-50%,-120%);opacity:0}}
  .hidden{display:none !important}
  .sync-badge{position:fixed;top:10px;left:10px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:10px;font-weight:700;letter-spacing:.8px;padding:4px 8px;border-radius:999px;z-index:100;display:none}
</style>
</head>
<body>
<div class="sync-badge" id="syncBadge">● LOCAL</div>
<div class="overlay-root">
  <div class="scoreboard-wrap" id="board">
    <div class="score-box blue" id="boxA"><div class="gloss-highlight"></div><div class="score-inner"><div class="score-num" id="scoreA">0</div><div class="float-badge hidden" id="badgeA">+1</div></div><div class="ticker-bar"><div class="ticker-track left-scroll" id="tickerA"><span>MALWA LIVE •</span></div></div></div>
    <div class="center-box"><div class="live-pill hidden" id="livePill"><span class="live-dot"></span>LIVE</div><div class="team team-a" id="teamA">TEAM A</div><div class="vs">VS</div><div class="team team-b" id="teamB">TEAM B</div><div class="tournament-strip" id="tournament">TOURNAMENT</div></div>
    <div class="score-box red" id="boxB"><div class="gloss-highlight"></div><div class="score-inner"><div class="score-num" id="scoreB">0</div><div class="float-badge hidden" id="badgeB">+1</div></div><div class="ticker-bar"><div class="ticker-track right-scroll" id="tickerB"><span>LIVE SCORE •</span></div></div></div>
  </div>
</div>
<script>
const KEY = 'malwalive_scoreboard_v2';
const FB_KEY = 'malwalive_fb_config';
const CHANNEL = new BroadcastChannel('malwalive_sync');

function defaults(){
  return {teamA:'MALWA KINGS',teamB:'SANGRUR LIONS',scoreA:0,scoreB:0,tournament:'PUNJAB KABADDI CUP 2026',tickerA:'MALWA LIVE • WWW.MALWALIVE1.COM •',tickerB:'LIVE SCORE • MALWA LIVE •',live:true,lastGoal:null};
}

function render(data){
  document.getElementById('teamA').textContent = (data.teamA||'TEAM A').toUpperCase();
  document.getElementById('teamB').textContent = (data.teamB||'TEAM B').toUpperCase();
  document.getElementById('scoreA').textContent = data.scoreA ?? 0;
  document.getElementById('scoreB').textContent = data.scoreB ?? 0;
  document.getElementById('tournament').textContent = (data.tournament||'').toUpperCase();
  document.getElementById('tickerA').innerHTML = '<span>'+ (data.tickerA||'') +'  •  '+(data.tickerA||'')+'  •  '+(data.tickerA||'')+'  •  </span>';
  document.getElementById('tickerB').innerHTML = '<span>'+ (data.tickerB||'') +'  •  '+(data.tickerB||'')+'  •  '+(data.tickerB||'')+'  •  </span>';
  const pill = document.getElementById('livePill');
  if(data.live) pill.classList.remove('hidden'); else pill.classList.add('hidden');
  if(data.lastGoal){
    const box = data.lastGoal==='A'?document.getElementById('boxA'):document.getElementById('boxB');
    const badge = data.lastGoal==='A'?document.getElementById('badgeA'):document.getElementById('badgeB');
    box.classList.remove('pulse'); void box.offsetWidth; box.classList.add('pulse');
    badge.classList.remove('hidden'); setTimeout(()=>badge.classList.add('hidden'),1000);
  }
}

function loadLocal(){
  try{ const raw = localStorage.getItem(KEY); if(!raw) return defaults(); return {...defaults(), ...JSON.parse(raw)}; }catch(e){return defaults()}
}

let current = loadLocal();
render(current);

// Local sync
window.addEventListener('storage', (e)=>{
  if(e.key===KEY && e.newValue){
    try{
      const d = {...defaults(), ...JSON.parse(e.newValue)};
      if(d.scoreA===current.scoreA && d.scoreB===current.scoreB) d.lastGoal=null;
      current=d; render(current);
      updateBadge('LOCAL');
    }catch{}
  }
});
CHANNEL.onmessage = (e)=>{ if(e.data && e.data.type==='update'){ const d={...defaults(),...e.data.payload}; current=d; render(current); updateBadge('LOCAL'); } };

// Firebase sync
let fbApp=null, fbDb=null, fbRef=null;
function updateBadge(mode){ const b=document.getElementById('syncBadge'); b.style.display='block'; b.textContent='● '+mode; if(mode==='FIREBASE') b.style.background='rgba(34,197,94,.25)'; else b.style.background='rgba(0,0,0,.6)'; }

function initFirebase(){
  try{
    const raw = localStorage.getItem(FB_KEY);
    if(!raw) return;
    const cfg = JSON.parse(raw);
    if(!cfg.enabled || !cfg.apiKey || !cfg.databaseURL) return;
    if(fbApp) return;
    const fbConfig = {apiKey:cfg.apiKey, authDomain:cfg.authDomain, databaseURL:cfg.databaseURL, projectId:cfg.projectId, storageBucket:cfg.storageBucket||'', messagingSenderId:cfg.messagingSenderId||'', appId:cfg.appId||''};
    fbApp = firebase.initializeApp(fbConfig);
    fbDb = firebase.database();
    const path = cfg.dbPath || '/malwalive/scoreboard';
    fbRef = fbDb.ref(path);
    fbRef.on('value', (snap)=>{
      const val = snap.val();
      if(!val) return;
      const d = {...defaults(), ...val};
      // avoid loop if same timestamp and scores
      if(JSON.stringify(d)===JSON.stringify(current)) return;
      current=d; render(current); localStorage.setItem(KEY, JSON.stringify(d)); updateBadge('FIREBASE');
    });
    updateBadge('FIREBASE');
    console.log('Firebase connected to',path);
  }catch(err){ console.warn('Firebase init fail',err); }
}

initFirebase();
// re-try init when storage changes for fb config
window.addEventListener('storage', (e)=>{ if(e.key===FB_KEY) { location.reload(); } });
</script>
</body>
</html>
